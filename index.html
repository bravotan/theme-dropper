<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Theme Dropper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 上にChromeのプレビュー、下に「画像からピック」と「色の一覧」を並べ、最後にmanifest出力 */
:root{
  --bg:#eef1f4; --surface:#ffffff; --line:#d5dce4; --fg:#17202b; --muted:#5a6676;
  --accent:#1d6c88; --accent-soft:#dbeaf0; --warn:#b2541b;
  --f-body:"IBM Plex Sans JP",-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11151a; --surface:#192029; --line:#2b3542; --fg:#e4e9ef; --muted:#93a0ae;
  --accent:#62b4d0; --accent-soft:#17323e; --warn:#ef9f62; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11151a; --surface:#192029; --line:#2b3542; --fg:#e4e9ef; --muted:#93a0ae;
  --accent:#62b4d0; --accent-soft:#17323e; --warn:#ef9f62; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.6 var(--f-body);padding-inline:16px;padding-block:20px 48px}
.app{max-width:1240px;margin:0 auto;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font-size:20px;margin:0;letter-spacing:.01em}
header p{margin:0;color:var(--muted);font-size:13px}
header .seg{margin-left:auto}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(340px,1fr);gap:18px;align-items:start}
.left{display:grid;gap:18px;min-width:0;align-content:start}
/* 右のカラーピッカー枠はスクロールしても画面内に留まる */
.picker{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto;align-content:start}
@media (max-width:880px){.cols{grid-template-columns:minmax(0,1fr)}.picker{position:static;max-height:none}}
button,.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:7px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default;border-color:var(--line)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
button:focus-visible,input:focus-visible,.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 11px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.btns{display:flex;flex-wrap:wrap;gap:8px}
code,.mono{font-family:var(--f-mono)}

/* ---- Chrome preview ---- */
.win{border-radius:10px;overflow:hidden;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.12);font:12px/1.3 -apple-system,system-ui,sans-serif;user-select:none}
.win [data-slot]{cursor:pointer}
.win [data-slot].hl{outline:2px dashed var(--accent);outline-offset:-3px}
.w-frame{background:var(--p-frame);display:flex;align-items:flex-end;gap:12px;padding:8px 10px 0;min-height:42px}
.lights{display:flex;gap:7px;align-self:center;padding-bottom:7px;flex:none}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.win.inactive .lights i{background:#9a9ca1;opacity:.55}
.tabs{display:flex;align-items:flex-end;flex:1;min-width:0}
.tab{flex:0 1 190px;min-width:0;height:32px;display:flex;align-items:center;gap:7px;padding:0 12px;border-radius:9px 9px 0 0;position:relative}
.tab.act{background:var(--p-toolbar);color:var(--p-tabtext)}
.tab.bg{background:var(--p-bgtab);color:var(--p-tabbgtext)}
.tab.bg+.tab.bg::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:1px;background:currentColor;opacity:.3}
.fav{width:14px;height:14px;border-radius:4px;background:currentColor;opacity:.45;flex:none}
.tab .t{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.tab .x{opacity:.6}
.newtab{color:var(--p-tabbgtext);font-size:18px;padding:0 10px 6px;flex:none}
.w-tool{background:var(--p-toolbar);display:flex;align-items:center;gap:4px;padding:6px 8px;color:var(--p-icon)}
.ico{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;flex:none}
.ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.omni{flex:1;min-width:0;height:30px;border-radius:15px;background:var(--p-omnibg);display:flex;align-items:center;padding:0 14px;margin:0 6px}
.omni span{color:var(--p-omnitext);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.w-bm{background:var(--p-toolbar);color:var(--p-bm);display:flex;gap:18px;padding:3px 14px 8px;overflow:hidden;white-space:nowrap}
.w-bm span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:currentColor;opacity:.4;margin-right:6px;vertical-align:-1px}
.w-ntp{background:var(--p-ntpbg);color:var(--p-ntptext);min-height:130px;display:grid;place-content:center;gap:16px;padding:18px;border-top:1px solid rgba(127,127,127,.18)}
.ntp-search{width:min(420px,70vw);height:36px;border-radius:18px;border:1px solid currentColor;opacity:.35}
.ntp-tiles{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.ntp-tiles div{display:grid;justify-items:center;gap:6px;font-size:11px}
.ntp-tiles i{width:34px;height:34px;border-radius:50%;background:currentColor;opacity:.12;display:block}
.pv-hint{font-size:12px;color:var(--muted);margin:0}

/* ---- picker ---- */
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.th{position:relative;flex:none;padding:0;width:84px;height:58px;border-radius:7px;overflow:hidden;border:2px solid transparent;background:var(--bg)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th[aria-pressed="true"]{border-color:var(--accent)}
.th .rm{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:18px;text-align:center}
.th.add{display:grid;place-items:center;border:1.5px dashed var(--line);color:var(--muted);font-size:12px;line-height:1.3;text-align:center}
.stage{position:relative;border-radius:8px;overflow:hidden;min-height:180px;display:grid;place-items:center;
  background:repeating-conic-gradient(rgba(127,127,127,.18) 0 25%,transparent 0 50%) 0 0/16px 16px;border:1px solid var(--line)}
.stage.drag{outline:2px dashed var(--accent);outline-offset:-6px}
#view{display:block;max-width:100%;max-height:min(420px,50vh);width:auto;height:auto;cursor:crosshair;touch-action:none}
.loupe{position:absolute;pointer-events:none;border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.35);background:#000;width:121px}
.loupe canvas{display:block;width:121px;height:121px;image-rendering:pixelated}
.loupe div{font:12px var(--f-mono);color:#fff;padding:4px 8px;display:flex;align-items:center;gap:6px}
.loupe b{width:12px;height:12px;border-radius:3px;border:1px solid rgba(255,255,255,.5);display:block}
.target{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:13px}
.target strong{color:var(--accent)}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}
.hist{display:flex;flex-wrap:wrap;gap:6px}
.hist button{width:26px;height:26px;padding:0;border-radius:6px}
.small{font-size:12px;color:var(--muted);margin:0}

/* ---- slots ---- */
.slots{display:grid;gap:2px}
.grp{font-size:11px;letter-spacing:.08em;color:var(--muted);margin:10px 0 2px;text-transform:uppercase}
.grp:first-child{margin-top:0}
.row{display:grid;grid-template-columns:32px minmax(0,1fr) 82px 40px auto;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;border:1px solid transparent;cursor:pointer}
.row:hover{background:var(--bg)}
.row.active{border-color:var(--accent);background:var(--accent-soft)}
.sw{position:relative;width:32px;height:32px;border-radius:7px;border:1px solid var(--line);overflow:hidden;display:block}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.sw span{position:absolute;inset:0}
.row.off .sw span::after{content:attr(data-auto);position:absolute;inset:auto 0 0 0;font-size:9px;text-align:center;background:rgba(0,0,0,.55);color:#fff;line-height:13px}
.lab{font-size:13px;line-height:1.35}
.meta code{font-size:11px;color:var(--muted)}
.row.off .lab,.row.off .hx{opacity:.5}
.hx{width:100%;font:12px var(--f-mono);border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surface);color:var(--fg)}
.cr{font:11px var(--f-mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.cr.warn{color:var(--warn);font-weight:500}
.tg{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);cursor:pointer}
@media (max-width:460px){.row{grid-template-columns:32px minmax(0,1fr) 74px auto}.cr{display:none}}

/* ---- output ---- */
.out{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:880px){.out{grid-template-columns:minmax(0,1fr)}}
.fields{display:flex;flex-wrap:wrap;gap:10px}
.fields label{display:grid;gap:3px;font-size:12px;color:var(--muted);flex:1 1 160px}
.fields input{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
pre{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:12px/1.55 var(--f-mono);overflow:auto;max-height:340px}
ol{margin:0;padding-left:1.3em;display:grid;gap:6px;font-size:13px}
ol code{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Theme Dropper</h1>
    <p data-i="tagline"></p>
    <div class="seg" role="group" data-ia="language"><button type="button" id="l-ja" lang="ja">日本語</button><button type="button" id="l-en" lang="en">English</button></div>
  </header>

  <div class="cols">
  <div class="left">
  <section class="panel" data-ia="preview">
    <div class="ph">
      <h2 data-i="preview"></h2>
      <div class="btns">
        <div class="seg" role="group" data-ia="winState">
          <button type="button" id="m-act" aria-pressed="true" data-i="active"></button>
          <button type="button" id="m-inact" aria-pressed="false" data-i="inactive"></button>
        </div>
        <div class="seg" role="group" data-ia="mode">
          <button type="button" id="m-norm" aria-pressed="true" data-i="normal"></button>
          <button type="button" id="m-inc" aria-pressed="false" data-i="incog"></button>
        </div>
      </div>
    </div>
    <div class="win" id="win">
      <div class="w-frame" id="pv-frame" data-slot="frame">
        <div class="lights"><i></i><i></i><i></i></div>
        <div class="tabs">
          <div class="tab act" data-slot="tab_text"><span class="fav"></span><span class="t">uv – Python package manager</span><span class="x">×</span></div>
          <div class="tab bg" data-slot="tab_background_text"><span class="fav"></span><span class="t" data-i="tab2"></span></div>
          <div class="tab bg" data-slot="tab_background_text"><span class="fav"></span><span class="t">Godot Engine</span></div>
          <span class="newtab" data-slot="tab_background_text">+</span>
        </div>
      </div>
      <div class="w-tool" data-slot="toolbar">
        <span class="ico" data-slot="toolbar_button_icon"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></span>
        <span class="ico" data-slot="toolbar_button_icon"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span>
        <span class="ico" data-slot="toolbar_button_icon"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19 4v4h-4"/></svg></span>
        <div class="omni" data-slot="omnibox_background"><span data-slot="omnibox_text">docs.astral.sh/uv/</span></div>
        <span class="ico" data-slot="toolbar_button_icon"><svg viewBox="0 0 24 24"><path d="M12 4l2.4 5 5.4.6-4 3.7 1.1 5.3L12 16l-4.9 2.6 1.1-5.3-4-3.7 5.4-.6z"/></svg></span>
        <span class="ico" data-slot="toolbar_button_icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r=".8"/><circle cx="12" cy="12" r=".8"/><circle cx="12" cy="18.5" r=".8"/></svg></span>
      </div>
      <div class="w-bm" data-slot="bookmark_text"><span data-i="bm1"></span><span>GitHub</span><span data-i="bm3"></span><span data-i="bm4"></span><span data-i="bm5"></span></div>
      <div class="w-ntp" data-slot="ntp_background">
        <div class="ntp-search"></div>
        <div class="ntp-tiles" data-slot="ntp_text">
          <div><i></i><span data-i="ntp1"></span></div><div><i></i><span data-i="ntp2"></span></div><div><i></i><span data-i="ntp3"></span></div><div><i></i><span data-i="bm4"></span></div>
        </div>
      </div>
    </div>
    <p class="pv-hint" data-i="pvHint"></p>
  </section>

    <section class="panel" data-ia="refs">
      <div class="ph">
        <h2 data-i="refs"></h2>
        <div class="btns">
          <button type="button" id="eyedrop" hidden data-i="eyedrop"></button>
        </div>
      </div>
      <div class="thumbs" id="thumbs"></div>
      <div class="stage" id="stage">
        <canvas id="view" data-ia="viewAria"></canvas>
        <div class="loupe" id="loupe" hidden><canvas id="lc" width="121" height="121"></canvas><div><b id="lsw"></b><span id="lhex"></span></div></div>
      </div>
      <div class="target">
        <span><span data-i="target"></span> <strong id="tgt"></strong></span>
      </div>
      <div>
        <p class="small" data-i="histLabel"></p>
        <div class="hist" id="hist"></div>
      </div>
      <p class="small" data-i="dropHint"></p>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </section>

  </div>
    <section class="panel picker" data-ia="colors">
      <div class="ph">
        <h2 data-i="colors"></h2>
        <div class="btns">
          <button type="button" id="undo" data-it="undoT" disabled data-i="undo"></button>
          <button type="button" id="redo" data-it="redoT" disabled data-i="redo"></button>
          <button type="button" id="reset" data-i="reset"></button>
        </div>
      </div>
      <div class="slots" id="slots"></div>
      <p class="small" data-i="slotsNote"></p>
    </section>
  </div>

  <section class="panel" data-ia="export">
    <h2 data-i="export"></h2>
    <div class="out">
      <div style="display:grid;gap:12px;min-width:0">
        <div class="fields">
          <label><span data-i="themeName"></span><input id="name" maxlength="45"></label>
          <label style="flex:0 1 110px"><span data-i="version"></span><input id="ver" maxlength="14"></label>
        </div>
        <div class="btns">
          <button type="button" class="primary" id="dir" hidden></button>
          <button type="button" id="dirchg" hidden data-i="dirchg"></button>
          <button type="button" id="dl" data-i="dl"></button>
          <button type="button" id="copy" data-i="copy"></button>
          <label class="btn"><span data-i="imp"></span><input type="file" id="imp" accept=".json,application/json" hidden></label>
        </div>
        <ol>
          <li data-ih="step1"></li>
          <li data-ih="step2"></li>
          <li data-ih="step3"></li>
        </ol>
      </div>
      <pre id="json"></pre>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>

const LKEY='theme-dropper-lang';

  const l=(navigator.languages&&navigator.languages[0])||navigator.language||'en';return /^ja\b/i.test(l)?'ja':'en'})();
const t=(k,v={})=>(I18N[LANG][k]??I18N.ja[k]??k).replace(/\{(\w+)\}/g,(_,x)=>v[x]??'');
const SLOTS=[
  {key:'frame',label:'枠(タイトルバー)',en:'Frame (title bar)',group:'frame',def:'#2f4a6b',on:true},

  {key:'background_tab',label:'非アクティブなタブの背景',en:'Inactive tab background',group:'tabs',def:'#3d5878',on:false},
  {key:'tab_text',label:'アクティブなタブの文字',en:'Active tab text',group:'tabs',def:'#1b2430',on:true},

  {key:'bookmark_text',label:'ブックマークの文字',en:'Bookmark text',group:'toolbar',def:'#2a3644',on:true},
  {key:'omnibox_background',label:'アドレスバーの背景',en:'Address bar background',group:'omni',def:'#ffffff',on:false},
  {key:'omnibox_text',label:'アドレスバーの文字',en:'Address bar text',group:'omni',def:'#1b2430',on:false},
  {key:'ntp_background',label:'新しいタブの背景',en:'New Tab background',group:'ntp',def:'#f6f8fa',on:false},
  {key:'ntp_text',label:'新しいタブの文字',en:'New Tab text',group:'ntp',def:'#1b2430',on:false},
];
const PAIRS={tab_background_text:'frame',tab_text:'toolbar',bookmark_text:'toolbar',toolbar_button_icon:'toolbar',omnibox_text:'omnibox_background',ntp_text:'ntp_background'};
const KEY='theme-dropper-v1';
const S={colors:{},on:{},active:'frame',name:'My Frame Theme',version:'1.0',auto:true,history:[],inactive:false,incog:false};
const resetState=()=>{SLOTS.forEach(s=>{S.colors[s.key]=s.def;S.on[s.key]=s.on})};
resetState();
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');
  if(d){Object.assign(S.colors,d.colors||{});Object.assign(S.on,d.on||{});
    ['name','version','auto','history'].forEach(k=>{if(d[k]!==undefined)S[k]=d[k]});
    if(d.active&&d.active in S.colors)S.active=d.active}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({colors:S.colors,on:S.on,name:S.name,version:S.version,auto:S.auto,history:S.history,active:S.active}))}catch(e){}};

/* color helpers */
const norm=h=>{h=(h||'').trim().replace(/^#/,'');if(/^[0-9a-f]{3}$/i.test(h))h=h.split('').map(c=>c+c).join('');return /^[0-9a-f]{6}$/i.test(h)?'#'+h.toLowerCase():null};
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const hex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const lum=h=>{const c=rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const mix=(a,b,t)=>{const A=rgb(a),B=rgb(b);return hex(...A.map((v,i)=>v+(B[i]-v)*t))};
const auto=bg=>contrast(bg,'#1f1f1f')>=contrast(bg,'#ffffff')?'#1f1f1f':'#ffffff';

function eff(k){
  if(S.on[k])return S.colors[k];
  switch(k){
    case 'frame':return '#dde3ea';
    case 'frame_inactive':return mix(eff('frame'),'#ffffff',.22);
    case 'frame_incognito':return '#35363a';
    case 'frame_incognito_inactive':return mix(eff('frame_incognito'),'#ffffff',.12);
    case 'background_tab':return eff('frame');
    case 'toolbar':return '#ffffff';
    case 'tab_text':return auto(eff('toolbar'));
    case 'tab_background_text':return auto(eff('frame'));
    case 'toolbar_button_icon':return mix(auto(eff('toolbar')),eff('toolbar'),.3);
    case 'omnibox_background':return mix(eff('toolbar'),lum(eff('toolbar'))>.4?'#000000':'#ffffff',.07);
    case 'omnibox_text':return auto(eff('omnibox_background'));
    case 'bookmark_text':return eff('tab_text');
    case 'ntp_background':return '#ffffff';
    case 'ntp_text':return auto(eff('ntp_background'));
  }
}
const frameKey=()=>S.incog?(S.inactive?'frame_incognito_inactive':'frame_incognito'):(S.inactive?'frame_inactive':'frame');
const label=k=>{const s=SLOTS.find(x=>x.key===k);return LANG==='en'?s.en:s.label};

/* slot rows */
const rows={};let lastGroup='';
SLOTS.forEach(s=>{
  if(s.group!==lastGroup){const h=document.createElement('div');h.className='grp';h.dataset.i='g_'+s.group;$('#slots').append(h);lastGroup=s.group}
  const r=document.createElement('div');r.className='row';
  r.innerHTML=`<label class="sw"><input type="color" id="c-${s.key}" ><span></span></label>
    <div class="meta"><div class="lab"></div><code>${s.key}</code></div>
    <input class="hx" id="h-${s.key}" spellcheck="false" maxlength="7">
    <span class="cr" data-it="contrastT"></span>
    <label class="tg"><input type="checkbox" id="o-${s.key}"><span data-i="use"></span></label>`;
  $('#slots').append(r);
  const o={lab:r.querySelector('.lab'),el:r,color:r.querySelector('input[type=color]'),sw:r.querySelector('.sw span'),hx:r.querySelector('.hx'),cr:r.querySelector('.cr'),on:r.querySelector('input[type=checkbox]')};
  rows[s.key]=o;
  r.addEventListener('click',()=>{if(S.active!==s.key){S.active=s.key;update()}});
  o.color.addEventListener('input',()=>{S.colors[s.key]=o.color.value;S.on[s.key]=true;S.active=s.key;update()});
  o.color.addEventListener('change',()=>{pushHist(o.color.value);commit();update()});
  o.hx.addEventListener('input',()=>{const v=norm(o.hx.value);if(v){S.colors[s.key]=v;S.on[s.key]=true;update()}});
  o.hx.addEventListener('blur',()=>{o.hx.value=S.colors[s.key];commit()});
  o.hx.addEventListener('keydown',e=>{if(e.key==='Enter')o.hx.blur()});
  o.on.addEventListener('change',()=>{commit();S.on[s.key]=o.on.checked;update();commit()});
});

/* preview */
const win=$('#win');
win.addEventListener('click',e=>{const t=e.target.closest('[data-slot]');if(t){S.active=t.dataset.slot;update()}});
function setMode(inactive,incog){S.inactive=inactive;S.incog=incog;
  $('#m-act').setAttribute('aria-pressed',!inactive);$('#m-inact').setAttribute('aria-pressed',inactive);
  $('#m-norm').setAttribute('aria-pressed',!incog);$('#m-inc').setAttribute('aria-pressed',incog);
  if(/^frame/.test(S.active))S.active=frameKey();update()}
$('#m-act').onclick=()=>setMode(false,S.incog);$('#m-inact').onclick=()=>setMode(true,S.incog);
$('#m-norm').onclick=()=>setMode(S.inactive,false);$('#m-inc').onclick=()=>setMode(S.inactive,true);

function paintPreview(){
  const fk=frameKey(),fr=eff(fk),w=win.style;
  $('#pv-frame').dataset.slot=fk;
  win.classList.toggle('inactive',S.inactive);
  w.setProperty('--p-frame',fr);
  w.setProperty('--p-bgtab',S.on.background_tab?S.colors.background_tab:'transparent');
  const bgBehind=S.on.background_tab?S.colors.background_tab:fr;
  w.setProperty('--p-tabbgtext',S.on.tab_background_text?S.colors.tab_background_text:auto(bgBehind));
  w.setProperty('--p-toolbar',eff('toolbar'));
  w.setProperty('--p-tabtext',eff('tab_text'));
  w.setProperty('--p-icon',eff('toolbar_button_icon'));
  w.setProperty('--p-omnibg',eff('omnibox_background'));
  w.setProperty('--p-omnitext',eff('omnibox_text'));
  w.setProperty('--p-bm',eff('bookmark_text'));
  w.setProperty('--p-ntpbg',eff('ntp_background'));
  w.setProperty('--p-ntptext',eff('ntp_text'));
  win.querySelectorAll('[data-slot]').forEach(el=>el.classList.toggle('hl',el.dataset.slot===S.active));
}

/* manifest */
function manifestText(){
  const colors={};SLOTS.forEach(s=>{if(S.on[s.key])colors[s.key]=rgb(S.colors[s.key])});
  const m={manifest_version:3,name:S.name.trim()||'My Theme',version:S.version.trim()||'1.0',theme:{colors}};
  return JSON.stringify(m,null,2).replace(/\[\s+(\d+),\s+(\d+),\s+(\d+)\s+\]/g,'[$1, $2, $3]')+'\n';
}

function update(){
  SLOTS.forEach(s=>{const o=rows[s.key],c=S.colors[s.key];
    o.el.classList.toggle('active',S.active===s.key);o.el.classList.toggle('off',!S.on[s.key]);
    o.color.value=c;o.sw.style.background=eff(s.key);
    if(document.activeElement!==o.hx)o.hx.value=c;
    o.on.checked=S.on[s.key];
    const p=PAIRS[s.key];
    if(p){const v=contrast(eff(s.key),eff(p));o.cr.textContent=v.toFixed(1);o.cr.classList.toggle('warn',v<3)}else o.cr.textContent='';
  });
  $('#tgt').textContent=label(S.active);
  paintPreview();
  $('#json').textContent=manifestText();
  renderHist();save();
}

/* history */
function pushHist(h){S.history=[h,...S.history.filter(x=>x!==h)].slice(0,18)}
function renderHist(){const box=$('#hist');box.textContent='';
  if(!S.history.length){const p=document.createElement('span');p.className='small';p.textContent=t('none');box.append(p);return}
  S.history.forEach(h=>{const b=document.createElement('button');b.type='button';b.style.background=h;b.title=h;b.setAttribute('aria-label',t('apply',{h}));b.onclick=()=>assign(h);box.append(b)})}

function assign(h){
  commit();
  S.colors[S.active]=h;S.on[S.active]=true;pushHist(h);
  update();commit();toast(t('tSet',{l:label(S.active),h}));
}

/* undo / redo: 色と「使う」の状態をスナップショットで管理 */
const undoStack=[],redoStack=[];
const snap=()=>JSON.stringify({colors:S.colors,on:S.on});
let lastSnap=snap();
function updUR(){$('#undo').disabled=!undoStack.length;$('#redo').disabled=!redoStack.length}
function commit(){const s=snap();if(s===lastSnap)return;undoStack.push(lastSnap);if(undoStack.length>200)undoStack.shift();redoStack.length=0;lastSnap=s;updUR()}
function restore(s){const d=JSON.parse(s);S.colors=d.colors;S.on=d.on;lastSnap=s;update();updUR()}
function undo(){commit();if(!undoStack.length)return;redoStack.push(lastSnap);restore(undoStack.pop());toast(t('tUndo'))}
function redo(){if(!redoStack.length)return;undoStack.push(lastSnap);restore(redoStack.pop());toast(t('tRedo'))}
$('#undo').onclick=undo;$('#redo').onclick=redo;
document.addEventListener('keydown',e=>{
  if(!(e.metaKey||e.ctrlKey)||e.key.toLowerCase()!=='z')return;
  const t=e.target;if(t.matches&&t.matches('input:not([type=color]):not([type=checkbox]),textarea'))return;
  e.preventDefault();e.shiftKey?redo():undo();
});

/* images */
const imgs=[];let cur=-1;
const view=$('#view'),vctx=view.getContext('2d',{willReadFrequently:true});
function addCanvas(cv,name){
  const t=document.createElement('canvas');const sc=168/Math.max(cv.width,cv.height);
  t.width=Math.max(1,Math.round(cv.width*sc));t.height=Math.max(1,Math.round(cv.height*sc));
  t.getContext('2d').drawImage(cv,0,0,t.width,t.height);
  imgs.push({cv,name,thumb:t.toDataURL('image/jpeg',.8)});selectImg(imgs.length-1);
}
async function addFile(f){
  if(!f||!f.type.startsWith('image/'))return;
  try{const bmp=await createImageBitmap(f);const sc=Math.min(1,3000/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);addCanvas(cv,f.name||t('pasted'));
  }catch(e){toast(t('tLoadFail'))}
}
function selectImg(i){
  cur=i;const im=imgs[i];
  if(im){view.width=im.cv.width;view.height=im.cv.height;vctx.drawImage(im.cv,0,0);view.hidden=false}else{view.hidden=true}
  renderThumbs();
}
function renderThumbs(){
  const box=$('#thumbs');box.textContent='';
  imgs.forEach((im,i)=>{const b=document.createElement('button');b.type='button';b.className='th';b.title=im.name;
    b.setAttribute('aria-pressed',i===cur);b.innerHTML=`<img alt="${im.name.replace(/"/g,'')}" src="${im.thumb}"><span class="rm" role="button" aria-label="${t('remove')}">×</span>`;
    b.onclick=e=>{if(e.target.classList.contains('rm')){imgs.splice(i,1);let n=cur>i?cur-1:cur;if(n>=imgs.length)n=imgs.length-1;selectImg(n)}else selectImg(i)};
    box.append(b)});
  const a=document.createElement('button');a.type='button';a.className='th add';a.textContent=t('add');a.onclick=()=>$('#file').click();box.append(a);
}
$('#file').onchange=e=>{[...e.target.files].forEach(addFile);e.target.value=''};

/* sample image so the tool opens in a working state */
(function sample(){
  const cv=document.createElement('canvas');cv.width=720;cv.height=420;const c=cv.getContext('2d');
  const g=c.createLinearGradient(0,0,0,300);g.addColorStop(0,'#1d3557');g.addColorStop(.55,'#b56576');g.addColorStop(1,'#f2b880');
  c.fillStyle=g;c.fillRect(0,0,720,420);
  c.fillStyle='#f6d186';c.beginPath();c.arc(520,230,46,0,Math.PI*2);c.fill();
  const hill=(col,pts)=>{c.fillStyle=col;c.beginPath();c.moveTo(0,420);pts.forEach(([x,y])=>c.lineTo(x,y));c.lineTo(720,420);c.fill()};
  hill('#355070',[[0,260],[120,200],[240,250],[380,180],[520,262],[640,214],[720,240]]);
  hill('#22333b',[[0,320],[160,268],[300,316],[460,262],[600,312],[720,284]]);
  ['#1d3557','#355070','#6d597a','#b56576','#e56b6f','#f2b880'].forEach((col,i)=>{c.fillStyle=col;c.fillRect(24+i*60,356,52,40)});
  c.fillStyle='rgba(255,255,255,.85)';c.font='13px sans-serif';c.fillText('Sample',24,342);
  addCanvas(cv,t('sample'));
})();

/* loupe */
const stage=$('#stage'),loupe=$('#loupe'),lctx=$('#lc').getContext('2d');
function pos(e){const r=view.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)*view.width/r.width),y=Math.floor((e.clientY-r.top)*view.height/r.height);
  return (x<0||y<0||x>=view.width||y>=view.height)?null:{x,y}}
const pixel=(x,y)=>{const d=vctx.getImageData(x,y,1,1).data;return hex(d[0],d[1],d[2])};
view.addEventListener('pointermove',e=>{
  const p=pos(e);if(!p){loupe.hidden=true;return}
  lctx.imageSmoothingEnabled=false;lctx.fillStyle='#777';lctx.fillRect(0,0,121,121);
  lctx.drawImage(view,p.x-5,p.y-5,11,11,0,0,121,121);
  lctx.lineWidth=1;lctx.strokeStyle='#000';lctx.strokeRect(54.5,54.5,12,12);lctx.strokeStyle='#fff';lctx.strokeRect(55.5,55.5,10,10);
  const h=pixel(p.x,p.y);$('#lhex').textContent=h;$('#lsw').style.background=h;
  loupe.hidden=false;
  const sr=stage.getBoundingClientRect();let lx=e.clientX-sr.left+18,ly=e.clientY-sr.top+18;
  if(lx+125>sr.width)lx=e.clientX-sr.left-139;if(ly+150>sr.height)ly=e.clientY-sr.top-168;
  loupe.style.left=Math.max(4,lx)+'px';loupe.style.top=Math.max(4,ly)+'px';
});
view.addEventListener('pointerleave',()=>{loupe.hidden=true});
view.addEventListener('click',e=>{const p=pos(e);if(p)assign(pixel(p.x,p.y))});

/* drop & paste */
['dragenter','dragover'].forEach(t=>document.addEventListener(t,e=>{if([...(e.dataTransfer?.types||[])].includes('Files')){e.preventDefault();stage.classList.add('drag')}}));
['dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{if(t==='dragleave'&&e.relatedTarget)return;stage.classList.remove('drag')}));
document.addEventListener('drop',e=>{e.preventDefault();[...(e.dataTransfer?.files||[])].forEach(addFile)});
document.addEventListener('paste',e=>{[...(e.clipboardData?.items||[])].forEach(it=>{if(it.type.startsWith('image/'))addFile(it.getAsFile())})});

/* reset (two-step) */
let resetArmed=0;
$('#reset').onclick=e=>{

$('#name').oninput=e=>{S.name=e.target.value;update()};
$('#ver').oninput=e=>{S.version=e.target.value;update()};

  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(t('tCopied'))).catch(()=>{
    const r=document.createRange();r.selectNodeContents($('#json'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast(t('tSelected'))})};
$('#dl').onclick=()=>{const b=new Blob([manifestText()],{type:'application/json'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='manifest.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
let dirHandle=null;
async function writeDir(pick){
  try{
    if(pick||!dirHandle)dirHandle=await window.showDirectoryPicker({mode:'readwrite',id:'theme-dropper'});
    const fh=await dirHandle.getFileHandle('manifest.json',{create:true});const w=await fh.createWritable();
    await w.write(manifestText());await w.close();
    dirLabel();$('#dirchg').hidden=false;
    toast(t('tWrote',{n:dirHandle.name}));
  }catch(e){if(e.name!=='AbortError')toast(t('tWriteFail',{m:e.message}))}
}
if('showDirectoryPicker' in window){$('#dir').hidden=false;$('#dir').onclick=()=>writeDir(false);$('#dirchg').onclick=()=>writeDir(true)}
$('#imp').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const m=JSON.parse(await f.text());const c=m?.theme?.colors;if(!c)throw new Error(t('noColors'));
    commit();
    SLOTS.forEach(s=>{const v=c[s.key];if(Array.isArray(v)&&v.length>=3){S.colors[s.key]=hex(v[0],v[1],v[2]);S.on[s.key]=true}else S.on[s.key]=false});
    if(m.name){S.name=m.name;$('#name').value=m.name}if(m.version){S.version=m.version;$('#ver').value=m.version}
    update();commit();toast(t('tImp'));
  }catch(err){toast(t('tImpFail',{m:err.message}))}};

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}

const dirLabel=()=>{$('#dir').textContent=dirHandle?t('dirOver',{n:dirHandle.name}):t('dir')};
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i)});
  document.querySelectorAll('[data-ih]').forEach(el=>{el.innerHTML=t(el.dataset.ih)});
  document.querySelectorAll('[data-it]').forEach(el=>{el.title=t(el.dataset.it)});
  document.querySelectorAll('[data-ia]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.ia))});
  SLOTS.forEach(s=>{const o=rows[s.key],l=label(s.key);o.lab.textContent=l;o.sw.dataset.auto=t('auto');o.color.setAttribute('aria-label',t('colorOf',{l}));o.hx.setAttribute('aria-label',t('hexOf',{l}))});
  $('#l-ja').setAttribute('aria-pressed',LANG==='ja');$('#l-en').setAttribute('aria-pressed',LANG==='en');
  dirLabel();renderThumbs();update();
}
function setLang(l){LANG=l;try{localStorage.setItem(LKEY,l)}catch(e){}applyLang()}
$('#l-ja').onclick=()=>setLang('ja');$('#l-en').onclick=()=>setLang('en');

applyLang();
</script>
</body>
